name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server:
    name: Agent binaries and backend jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hidenseek-agent/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build agent
        working-directory: hidenseek-agent
        run: make release VERSION=${{ github.ref_name }}
      - name: Build backend
        working-directory: hidenseek-backend
        run: ./gradlew --no-daemon bootJar && cp build/libs/*.jar ../hidenseek-backend.jar
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            hidenseek-agent/dist/*
            hidenseek-backend.jar

  desktop:
    name: Desktop app (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebKitGTK
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install UI dependencies
        working-directory: hidenseek-app
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_DEFAULT_SERVER: ${{ vars.HIDENSEEK_DEFAULT_SERVER }}
        with:
          projectPath: hidenseek-app
          tagName: ${{ github.ref_name }}
          releaseName: Hidenseek VPN ${{ github.ref_name }}
          releaseDraft: true

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Build APK
        working-directory: hidenseek-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          VITE_DEFAULT_SERVER: ${{ vars.HIDENSEEK_DEFAULT_SERVER }}
        # Debug-signed so friends can sideload it. Configure a release keystore for Play Store builds.
        run: |
          npm ci
          npx tauri android init --ci
          npx tauri android build --apk --debug
          cp src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk hidenseek-vpn-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: hidenseek-app/hidenseek-vpn-android.apk
          draft: true
