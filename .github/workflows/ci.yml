name: CI

# Pipeline (jobs within a stage run in parallel):
#
#   1 · Build & test       backend tests · agent tests + binaries · app core tests + UI build
#   2 · Static analysis    CodeQL (Java, TypeScript, Go)
#   3 · Package            backend Docker image + smoke test against MySQL · Windows · Linux · Android apps
#   4 · Gate               single required status check for branch protection
#   5 · Release            GitHub release with every installer (main pushes only)
#
# Release assets keep fixed names, so https://github.com/<repo>/releases/latest/download/<name>
# always points at the newest build. The landing page and the agent install script rely on that.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '24'
  # Tauri bundles (MSI especially) need a numeric x.y.z version.
  APP_VERSION: 0.1.${{ github.run_number }}
  # Pre-filled server address in the apps. Forks set the HIDENSEEK_DEFAULT_SERVER repo variable.
  VITE_DEFAULT_SERVER: ${{ vars.HIDENSEEK_DEFAULT_SERVER || 'https://vpn.tanmaysinghx.com' }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # Stage 1 · Build & test
  # ───────────────────────────────────────────────────────────────────────────────────────────────

  backend:
    name: "Stage 1 · Backend tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hidenseek-console/package-lock.json

      # The admin console (Angular) is served by the backend at /console, so it's bundled in the jar.
      - name: Build the console
        working-directory: hidenseek-console
        run: npm ci && npm run build:backend

      # Tests run on an in-memory H2 database in MySQL mode; they never touch a real database.
      - name: Build and test
        working-directory: hidenseek-backend
        run: ./gradlew --no-daemon test bootJar

      # A green build that ran no tests is worse than a red one, so the count is asserted.
      - name: Assert tests actually ran
        working-directory: hidenseek-backend
        run: |
          reports=build/test-results/test
          [ -d "$reports" ] || { echo "::error::No test reports; the test task did not run."; exit 1; }
          total=$(grep -ho 'tests="[0-9]*"' $reports/TEST-*.xml | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "Executed $total tests."
          if [ "${total:-0}" -lt 10 ]; then
            echo "::error::Only $total tests ran; expected at least 10."
            exit 1
          fi
          for f in $reports/TEST-*.xml; do
            if grep -q '<testsuite[^>]* tests="0"' "$f"; then echo "::error::$(basename "$f") ran zero tests."; exit 1; fi
          done

      - name: Test summary
        if: always()
        working-directory: hidenseek-backend
        run: |
          reports=build/test-results/test
          [ -d "$reports" ] || exit 0
          sum() { grep -ho "<testsuite[^>]* $1=\"[0-9]*\"" $reports/TEST-*.xml | grep -o "$1=\"[0-9]*\"" | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}'; }
          tests=$(sum tests); failures=$(sum failures); errors=$(sum errors); skipped=$(sum skipped)
          status="Passed"; [ $((failures + errors)) -gt 0 ] && status="Failed"
          {
            echo "### Backend tests — $status"
            echo ""
            echo "| Classes | Tests | Failures | Errors | Skipped |"
            echo "|---:|---:|---:|---:|---:|"
            echo "| $(ls $reports/TEST-*.xml | wc -l) | $tests | $failures | $errors | $skipped |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: hidenseek-backend/build/test-results/test/
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: hidenseek-backend/build/libs/hidenseek-backend-*.jar
          retention-days: 7

  agent:
    name: "Stage 1 · Agent tests & binaries"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: hidenseek-agent/go.mod
          cache-dependency-path: hidenseek-agent/go.sum

      - name: Vet and test
        working-directory: hidenseek-agent
        run: make test

      - name: Lint install script
        run: shellcheck hidenseek-agent/scripts/install.sh

      - name: Build static Linux binaries (amd64, arm64)
        working-directory: hidenseek-agent
        run: |
          make release VERSION=v${{ env.APP_VERSION }}
          ls -lh dist
          ./dist/hidenseek-agent-linux-amd64 version

      - uses: actions/upload-artifact@v4
        with:
          name: agent-binaries
          path: hidenseek-agent/dist/*
          retention-days: 7

  app-core:
    name: "Stage 1 · App core tests & UI build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hidenseek-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hidenseek-app/core

      # `npm ci` fails if package.json and the lock file disagree, so it doubles as a lock check.
      - name: Type-check and build UI
        working-directory: hidenseek-app
        run: npm ci && npm run build

      - name: Test core (sign-in, keys, config rendering)
        working-directory: hidenseek-app/core
        run: cargo test && cargo clippy --all-targets -- -D warnings

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # Stage 2 · Static analysis
  # ───────────────────────────────────────────────────────────────────────────────────────────────

  codeql:
    name: "Stage 2 · CodeQL (${{ matrix.language }})"
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript, go]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-extended

      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: hidenseek-agent/go.mod

      - if: matrix.language == 'go'
        working-directory: hidenseek-agent
        run: go build ./...

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # Stage 3 · Package
  # ───────────────────────────────────────────────────────────────────────────────────────────────

  image:
    name: "Stage 3 · Backend image & smoke test"
    runs-on: ubuntu-latest
    needs: [backend, agent, app-core]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hidenseek-backend/Dockerfile
          push: false
          load: true
          tags: hidenseek-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image runs: Flyway migrates a real MySQL, Hibernate validates the schema, and the
      # public endpoints answer. H2 in Stage 1 cannot catch MySQL-only schema problems.
      - name: Smoke test against MySQL 8
        run: |
          docker network create ci-net
          docker run -d --name ci-db --network ci-net \
            -e MYSQL_DATABASE=hidenseek -e MYSQL_USER=hidenseek -e MYSQL_PASSWORD=ci-password \
            -e MYSQL_ROOT_PASSWORD=ci-root mysql:8.4
          for i in $(seq 1 45); do
            docker exec ci-db mysqladmin ping -h 127.0.0.1 -uhidenseek -pci-password --silent && break
            sleep 2
          done

          docker run -d --name ci-app --network ci-net -p 8090:8090 \
            -e DB_URL="jdbc:mysql://ci-db:3306/hidenseek?allowPublicKeyRetrieval=true&useSSL=false" \
            -e DB_USERNAME=hidenseek -e DB_PASSWORD=ci-password \
            -e PORTAL_URL=https://sso.example.com -e PORTAL_CLIENT_ID=hidenseek-vpn \
            -e PUBLIC_URL=http://localhost:8090 \
            hidenseek-backend:ci

          started=$(date +%s)
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' ci-app 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            if [ "$(docker inspect -f '{{.State.Status}}' ci-app)" = "exited" ]; then
              echo "::error::Container exited during startup."; docker logs ci-app; exit 1
            fi
            sleep 5
          done
          boot_seconds=$(( $(date +%s) - started ))
          if [ "$(docker inspect -f '{{.State.Health.Status}}' ci-app)" != "healthy" ]; then
            echo "::error::Container never became healthy."; docker logs ci-app; exit 1
          fi

          config=$(curl -fsS http://localhost:8090/api/v1/public/config)
          echo "Public config: $config"
          curl -fsS http://localhost:8090/ | grep -q "Hidenseek VPN" || { echo "::error::Landing page not served."; exit 1; }
          curl -fsS http://localhost:8090/console/users | grep -q "<app-root>" || { echo "::error::Admin console not served."; exit 1; }
          curl -fsS http://localhost:8090/install.sh | head -1 | grep -q bash || { echo "::error::install.sh not served."; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/api/v1/me)" = "401" ] \
            || { echo "::error::/api/v1/me must require a token."; exit 1; }
          docker logs ci-app 2>&1 | grep -Eq 'Successfully applied [0-9]+ migrations?' \
            || { echo "::error::Flyway did not migrate the schema."; docker logs ci-app; exit 1; }

          size=$(docker image inspect hidenseek-backend:ci --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1024/1024}')
          {
            echo "### Backend image"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Image size | $size |"
            echo "| Healthy after | ${boot_seconds}s |"
            echo "| Flyway on MySQL 8.4 | migrated |"
            echo "| Landing page · console · install.sh · auth | ok |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs on failure
        if: failure()
        run: docker logs ci-app || true

  desktop:
    name: "Stage 3 · ${{ matrix.name }} app"
    needs: [app-core]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            # Oldest supported Ubuntu, so the AppImage and .deb run on older distros too.
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hidenseek-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hidenseek-app/src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 rpm

      # Bundled so users never install WireGuard themselves: the app installs it silently on first
      # connect if it's missing. The signature is checked, so a tampered download fails the build.
      - name: Bundle the WireGuard engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "hidenseek-app/src-tauri/windows"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $msi = "$dir/wireguard-amd64.msi"
          Invoke-WebRequest -Uri "https://download.wireguard.com/windows-client/wireguard-amd64-$env:WIREGUARD_VERSION.msi" -OutFile $msi
          $sig = Get-AuthenticodeSignature $msi
          Write-Host "Signature: $($sig.Status) by $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'WireGuard LLC') {
            throw "wireguard-amd64.msi is not validly signed by WireGuard LLC"
          }
        env:
          WIREGUARD_VERSION: '1.1.1'

      - name: Build installers
        working-directory: hidenseek-app
        shell: bash
        run: |
          npm ci
          npx tauri build --config "{\"version\":\"$APP_VERSION\"}"

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          b=hidenseek-app/src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp $b/nsis/*-setup.exe out/hidenseek-vpn-windows-x64-setup.exe
            cp $b/msi/*.msi       out/hidenseek-vpn-windows-x64.msi
          else
            cp $b/deb/*.deb           out/hidenseek-vpn-linux-amd64.deb
            cp $b/rpm/*.rpm           out/hidenseek-vpn-linux-x86_64.rpm
            cp $b/appimage/*.AppImage out/hidenseek-vpn-linux-x86_64.AppImage
            # Arch / CachyOS / Manjaro: repackage the .deb with makepkg in an Arch container.
            mkdir -p arch && cp hidenseek-app/packaging/arch/PKGBUILD out/hidenseek-vpn-linux-amd64.deb arch/
            docker run --rm -v "$PWD/arch:/build" -e HIDENSEEK_VERSION="$APP_VERSION" archlinux:latest bash -euc '
              pacman -Sy --noconfirm --needed base-devel > /dev/null
              useradd -m builder && chown -R builder /build
              su builder -c "cd /build && HIDENSEEK_VERSION=$HIDENSEEK_VERSION makepkg -f --nodeps"'
            cp "arch/hidenseek-vpn-${APP_VERSION}-1-x86_64.pkg.tar.zst" out/hidenseek-vpn-linux-x86_64.pkg.tar.zst
          fi
          ls -l out
          {
            echo "### ${{ matrix.name }} app $APP_VERSION"
            echo ""
            echo "| File | Size |"
            echo "|---|---:|"
            for f in out/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: out/*
          retention-days: 7

  android:
    name: "Stage 3 · Android app"
    runs-on: ubuntu-latest
    needs: [app-core]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hidenseek-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK at $ANDROID_HOME. android-actions/setup-android is
      # avoided: it installs the removed `tools` package by default and fails.
      - name: Accept SDK licenses and install NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "platform-tools" > /dev/null
          ls "$ANDROID_HOME/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hidenseek-app/src-tauri

      # Optimized build for phones (64- and 32-bit ARM): ~12 MB, versus ~180 MB for a debug APK.
      - name: Build APK
        working-directory: hidenseek-app
        # ANDROID_HOME is a runner environment variable, not part of the `env` context, so NDK_HOME
        # is derived in the shell (`${{ env.ANDROID_HOME }}` would expand to nothing).
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          test -d "$NDK_HOME" || { echo "::error::NDK not found at $NDK_HOME"; exit 1; }
          npm ci
          npx tauri android init --ci
          # Hidenseek icon (adaptive, dark tile) and a dark window/system splash instead of the defaults.
          node scripts/android-postinit.mjs
          npx tauri android build --apk --target aarch64 --target armv7 --config "{\"version\":\"$APP_VERSION\"}"

      # Android only installs an update over an older version when both are signed with the same
      # key, so releases use the keystore in secrets. Without it a one-off key is generated and
      # users have to uninstall before upgrading.
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find hidenseek-app/src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD not set; signing with a one-off key. Users must uninstall before installing this build over an older one."
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASS" -keypass "$PASS" \
              -alias hidenseek -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Hidenseek VPN" > /dev/null
          fi
          mkdir -p out
          "$BT/zipalign" -f -P 16 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$PASS" --ks-key-alias hidenseek \
            --out out/hidenseek-vpn-android.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify out/hidenseek-vpn-android.apk
          rm -f "$RUNNER_TEMP/release.jks"
          echo "### Android app $APP_VERSION — $(du -h out/hidenseek-vpn-android.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: app-Android
          path: out/*
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # Stage 4 · Gate
  # ───────────────────────────────────────────────────────────────────────────────────────────────

  # Android is advisory: a failed APK build is reported here but does not block the release, which
  # then ships without the APK (the landing page greys out a missing download).
  ci-status:
    name: "Stage 4 · All checks passed"
    runs-on: ubuntu-latest
    if: always()
    needs: [backend, agent, app-core, codeql, image, desktop, android]
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ toJSON(needs) }}
          ADVISORY: android
        run: |
          echo "### Pipeline result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for job in $(echo "$RESULTS" | jq -r 'keys[]'); do
            result=$(echo "$RESULTS" | jq -r --arg j "$job" '.[$j].result')
            note=""
            case "$result" in
              success|skipped) ;;
              *)
                if [[ " $ADVISORY " == *" $job "* ]]; then
                  note=" (advisory, not blocking)"
                  echo "::warning::$job $result; the release will ship without it."
                else
                  failed=1
                fi ;;
            esac
            echo "| $job | $result$note |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$failed" = "1" ]; then
            echo "::error::One or more pipeline jobs failed or were cancelled."
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # Stage 5 · Release
  # ───────────────────────────────────────────────────────────────────────────────────────────────

  release:
    name: "Stage 5 · Release"
    runs-on: ubuntu-latest
    needs: [ci-status]
    # !cancelled() is required: without a status function GitHub adds success(), which is false when
    # any upstream job failed, including the advisory Android build, and the release would be skipped.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.ci-status.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release artifacts
        id: prep
        run: |
          mkdir -p release
          cp artifacts/app-*/* release/
          if [ -f release/hidenseek-vpn-android.apk ]; then
            echo "android_note=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Android APK in this release (the Android build failed)."
            echo "android_note=> The Android APK is missing from this build; use the previous release for Android." >> "$GITHUB_OUTPUT"
          fi
          cp artifacts/agent-binaries/* release/
          cp "$(find artifacts/backend-jar -name '*.jar' ! -name '*-plain.jar' | head -1)" release/hidenseek-backend.jar
          cd release
          sha256sum hidenseek-backend.jar > hidenseek-backend.jar.sha256
          sha256sum hidenseek-vpn-* > SHA256SUMS
          ls -l
          echo "tag=v${APP_VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release v${APP_VERSION}"
            echo '```'
            cat SHA256SUMS hidenseek-backend.jar.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Hidenseek VPN ${{ steps.prep.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: release/*
          body: |
            ## Hidenseek VPN ${{ steps.prep.outputs.tag }}

            ${{ steps.prep.outputs.android_note }}

            Install the app, then enter your server address (for example `vpn.tanmaysinghx.com`) and sign in with Portal.

            ### Apps
            Nothing else to install: the WireGuard engine is built in on Linux and Android and bundled on Windows.

            | Platform | Download | Install |
            |---|---|---|
            | Windows 10/11 | **[Installer (.exe)](https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/hidenseek-vpn-windows-x64-setup.exe)** · [MSI](https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/hidenseek-vpn-windows-x64.msi) | Run it |
            | Ubuntu / Debian | **[.deb](https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/hidenseek-vpn-linux-amd64.deb)** | Open it, or `sudo apt install ./hidenseek-vpn-linux-amd64.deb` |
            | Fedora | **[.rpm](https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/hidenseek-vpn-linux-x86_64.rpm)** | Open it, or `sudo dnf install ./hidenseek-vpn-linux-x86_64.rpm` |
            | Arch / CachyOS / Manjaro | **[.pkg.tar.zst](https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/hidenseek-vpn-linux-x86_64.pkg.tar.zst)** | `sudo pacman -U hidenseek-vpn-linux-x86_64.pkg.tar.zst` |
            | Any Linux | [AppImage](https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/hidenseek-vpn-linux-x86_64.AppImage) | `chmod +x`, then open (asks for your password on connect) |
            | Android 7+ | **[APK](https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/hidenseek-vpn-android.apk)** | Open it and allow installs from your browser |

            ### Server
            - `hidenseek-backend.jar`: control plane (Java 25), or deploy with `deploy/docker-compose.yml`
