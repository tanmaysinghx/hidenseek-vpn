[package]
name = "hidenseek-app"
version = "0.1.0"
description = "Hidenseek VPN"
edition = "2021"
license = "MIT"

[lib]
# Tauri mobile builds the app as a library; desktop links it into main.rs.
name = "hidenseek_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-hidenseek-tunnel = { path = "../plugins/tunnel" }
hidenseek-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.13", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
