[package]
name = "tauri-plugin-hidenseek-tunnel"
version = "0.1.0"
edition = "2021"
description = "Android VpnService tunnel for Hidenseek VPN, backed by the official WireGuard library."
license = "MIT"
links = "tauri-plugin-hidenseek-tunnel"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
