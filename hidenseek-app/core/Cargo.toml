[package]
name = "hidenseek-core"
version = "0.1.0"
edition = "2021"
description = "Platform-independent client logic for Hidenseek VPN: Portal SSO login, backend API, keys and tunnel control."
license = "MIT"

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["net", "io-util", "time", "process", "macros", "rt", "sync", "fs"] }
url = "2.5.8"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[dev-dependencies]
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
defguard_wireguard_rs = "0.12.3"
