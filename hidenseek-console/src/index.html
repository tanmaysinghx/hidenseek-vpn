<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hidenseek VPN · Console</title>
  <base href="/console/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f17">
  <meta name="color-scheme" content="dark light">
  <script>
    // Theme before first paint (same choice as the landing page); core/theme.ts keeps it in sync.
    try {
      var t = localStorage.getItem('hs-theme');
      document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t
        : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
</head>
<body>
  <app-root></app-root>
</body>
</html>
